name: F01 Murmuration

on:
  pull_request:
    paths:
      - jobs/F01-murmuration/**
      - .github/workflows/F01.yml

permissions:
  contents: read

jobs:
  offline-functional:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser test tools
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Verify disk opening, offline runtime, GPU simulation and accessibility
        run: python jobs/F01-murmuration/check.py --report /tmp/F01-functional.json
      - name: Verify committed data and media integrity
        working-directory: jobs/F01-murmuration
        run: sha256sum --strict --check SHA256SUMS.txt
      - name: Retain exact functional results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: F01-functional-results
          path: /tmp/F01-functional.json
          if-no-files-found: warn
