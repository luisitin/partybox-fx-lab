<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Murmuration Lobby</title>
<style>
:root{--ui:#f5f6ff}
html,body{margin:0;height:100%;background:#0f1020;overflow:hidden;font-family:system-ui,Segoe UI,Arial,sans-serif}
#moon{position:fixed;inset:0;pointer-events:none;display:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:96vw;opacity:.6}
#hud:hover,#hud:focus-within{opacity:1}
#hud button{font:700 12px system-ui,sans-serif;color:var(--ui);background:rgba(20,16,50,.72);border:1px solid rgba(233,230,255,.45);border-radius:999px;padding:5px 11px;min-height:28px;cursor:pointer;white-space:nowrap}
#hud button:focus-visible{outline:3px solid #ffd166}
#cap{position:fixed;left:0;right:0;top:12%;text-align:center;color:var(--ui);font:900 clamp(28px,7vw,90px)/1 system-ui,sans-serif;letter-spacing:.04em;opacity:0;transition:opacity .3s;pointer-events:none}
.kiosk #hud{display:none}
</style></head>
<body>
<div id="moon"></div>
<canvas id="c" aria-label="A flock of birds swirling in a lobby"></canvas>
<div id="cap" role="status" aria-live="polite"></div>
<div id="hud"><button id="bJoin">join</button><button id="bCode">room code</button><button id="bWin">winner</button><button id="bTheme">theme</button><button id="bLook" title="bird colours">look</button><button id="bShape" title="bird shapes">shape</button></div>
<script>
(() => {
'use strict';
const Q = new URLSearchParams(location.search);
const PORTRAIT0 = innerHeight > innerWidth;
const N = PORTRAIT0 ? 400 : 640, CAPW = PORTRAIT0 ? 290 : 440;
const INK = Q.get('ambient') !== 'rainbow';
const TAU = 6.283185307;
const LOOKS = ['ink', 'rainbow', 'players', 'shimmer'], SHAPES = ['bird', 'dart', 'petal', 'comet'];
let look = Math.max(0, LOOKS.indexOf(Q.get('look') || 'rainbow')), shape = Math.max(0, SHAPES.indexOf(Q.get('shape') || 'bird'));
const PL_POP = ['#ff5d8f','#ffd166','#06d6a0','#4cc9f0','#b388ff','#ff9f43','#48dbfb','#f368e0'];
const PL_GOU = ['#fc93b6','#fcde9c','#5ae1c1','#87d9f5','#caaeff','#fcbd85','#85e4fc','#f49aeb'];
const THEMES = {
  pop: { bg: '#0f1020', sky: null, outline: '#0a0620', lw: 2.4, ink: '#b3b7d9', alpha: 1, tails: false,
    rainbow: ['#ff4d8d','#ffd23f','#2ee6a6','#42c6ff','#ff8a3d','#a970ff'], players: PL_POP, code: '#ffd166', win: '#ffd166', ui: '#f5f6ff' },
  gouache: { bg: '#0f1230', sky: 'linear-gradient(#1b2350,#0f1230)', outline: null, lw: 0, ink: '#cacde6', alpha: 0.88, tails: true,
    rainbow: ['#d9b8a4','#e9d29c','#9fc7c2','#a9b4e4','#d69bb6','#c3d39c'], players: PL_GOU, code: '#fcde9c', win: '#fcde9c', ui: '#e8e2ff' }
};
let themeName = Q.get('theme') === 'gouache' ? 'gouache' : 'pop';
let T = THEMES[themeName];
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches && Q.get('motion') !== '1';
if (Q.has('kiosk')) document.documentElement.classList.add('kiosk');

function prng(seed){ let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const seed = parseInt(Q.get('seed') || '20260928', 10);
const rnd = prng(seed), rnd2 = prng(seed ^ 0x9e3779b9), rnd3 = prng(seed ^ 0x51ed270b);

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const cap = document.getElementById('cap'), moon = document.getElementById('moon');
let W = 0, H = 0, S = 1, DPR = 1, started = false;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const sstep = k => { k = clamp(k, 0, 1); return k * k * (3 - 2 * k); };
function hex(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
for (const k in THEMES) { THEMES[k].rgb = THEMES[k].rainbow.map(hex); THEMES[k].prgb = THEMES[k].players.map(hex); THEMES[k].white = hex(k === 'pop' ? '#ffffff' : '#fff2d2'); }
const _c = [0, 0, 0];
function palAt(p, u){ const n = p.length, f = (u - Math.floor(u)) * n, i = Math.floor(f) % n, j = (i + 1) % n, k = sstep(f - Math.floor(f)); for (let c = 0; c < 3; c++) _c[c] = p[i][c] + (p[j][c] - p[i][c]) * k; return _c; }
let plc = [], plcKey = '';

const DT = 1 / 60, LOCK = 1.6;
let simT = 0, stepN = 0;
let cur = null;
const players = [];   // {name, seat}
const birds = [];
for (let i = 0; i < N; i++) {
  birds.push({ x: 0, y: 0, vx: 0, vy: 0, ph: rnd() * 6.283, sz: 0.85 + rnd() * 0.35, ci: i % 6, own: -1,
    col: [0,0,0], home: [0,0,0], cF: [0,0,0], cT: [0,0,0], cS: 0, cD: 1,
    role: 'free', pend: null, tgt: null, fm: 0, pulse: 0, boost: 1, turnT: 0, turnA: 0, wv: -1, d: 0,
    ts: 0, D: 1, p0x: 0, p0y: 0, v0x: 0, v0y: 0, p1x: 0, p1y: 0, v1x: 0, v1y: 0, uE: 0, om: 0, lane: 0, f: 0, leave: 0, lb: 1,
    hx: [0,0,0], hy: [0,0,0], amp: 0, fq: 1, bp: 0,
    rw: 0, sh: 0, dc: [0,0,0], rth: 0, uS: 0, wA: 0, wF: 3, psi: 0, ws: 0, dl: 0, n0: 0, ex: 1, ey: 0, tw: rnd() * 6.283 });
}
function homeCol(b){
  if (b.own >= 0) return hex(T.players[players[b.own].seat % 8]);
  return hex(INK ? T.ink : T.rainbow[b.ci]);
}
function setCol(b, to, delay, dur){ b.cF = b.col.slice(); b.cT = to; b.cS = simT + delay; b.cD = Math.max(1e-3, dur); }
function updCol(b){ const k = sstep((simT - b.cS) / b.cD); for (let c = 0; c < 3; c++) b.col[c] = b.cF[c] + (b.cT[c] - b.cF[c]) * k; }
function recolor(){
  for (const b of birds) {
    b.home = homeCol(b);
    const w = cur && (b.role === 'word' || b.pend === 'word'); const to = w ? hex(evColor(cur.ev)) : b.home;
    b.cF = to.slice(); b.cT = to.slice(); b.col = to.slice(); b.cS = simT - 10;
  }
}

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  S = Math.max(Math.min(W / 1920, H / 1080) * (H > W ? 1.9 : 1), 0.6);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  applyBg();
  if (started && reduced) draw();
}
function applyBg(){
  document.body.style.background = T.sky || T.bg; document.documentElement.style.background = T.bg;
  if (themeName === 'gouache') {
    const r = Math.min(W, H) * 0.08, x = W * 0.82, y = H * 0.2;
    moon.style.display = 'block';
    moon.style.background = 'radial-gradient(circle at ' + x + 'px ' + y + 'px, rgba(240,226,180,.75) 0, rgba(240,226,180,.75) ' + r + 'px, rgba(240,226,180,.28) ' + r * 1.08 + 'px, rgba(240,226,180,.12) ' + r * 1.6 + 'px, rgba(240,226,180,0) ' + r * 2.6 + 'px)';
  } else moon.style.display = 'none';
}

// ---------- text formation ----------
const off = document.createElement('canvas'), octx = off.getContext('2d', { willReadFrequently: true });
let formS = 6, box = { x0: 0, x1: 1, y0: 0, y1: 1 };
function textPoints(lines){
  const maxW = W * (H > W ? 0.72 : 0.8), maxH = H * 0.5;
  let fs = 300 * (H / 1080);
  const font = f => '900 ' + f + 'px "Arial Black", Impact, system-ui, sans-serif';
  octx.font = font(fs);
  const SP = 0.13;
  const lw = (l, f) => { octx.font = font(f); let t = 0; for (const ch of l) t += octx.measureText(ch).width + SP * f; return t - SP * f; };
  const w = Math.max(...lines.map(l => lw(l, fs)));
  fs = Math.min(fs, fs * maxW / w, maxH / (lines.length * 1.25));
  const lh = fs * 1.2, tw = Math.ceil(maxW + 20), th = Math.ceil(lines.length * lh + 20);
  off.width = tw; off.height = th; octx.font = font(fs); octx.textAlign = 'left'; octx.textBaseline = 'middle'; octx.fillStyle = '#fff';
  lines.forEach((l, i) => { let x = (tw - lw(l, fs)) / 2; for (const ch of l) { octx.fillText(ch, x, 10 + lh * (i + 0.5)); x += octx.measureText(ch).width + SP * fs; } });
  const data = octx.getImageData(0, 0, tw, th).data;
  let step = Math.max(4, Math.floor(fs / 26)), pts;
  for (;;) {
    pts = [];
    for (let y = step / 2; y < th; y += step) for (let x = step / 2; x < tw; x += step) if (data[((y | 0) * tw + (x | 0)) * 4 + 3] > 128) pts.push([x, y]);
    if (pts.length <= CAPW || step > 80) break; step += 1;
  }
  const ox = (W - tw) / 2, oy = H * (H > W ? 0.42 : 0.47) - th / 2;
  formS = step * 0.52;
  const out = pts.map(p => [p[0] + ox, p[1] + oy]);
  box = { x0: Math.min(...out.map(p => p[0])) - step, x1: Math.max(...out.map(p => p[0])) + step, y0: Math.min(...out.map(p => p[1])) - step, y1: Math.max(...out.map(p => p[1])) + step };
  return out.slice(0, CAPW);
}

// ---------- halo path (superellipse, exponent 4, arc-length table, clockwise on screen) ----------
let halo = null;
function buildHalo(){
  const cx = (box.x0 + box.x1) / 2, cy = (box.y0 + box.y1) / 2;
  const port = H > W, m = port ? 26 * (W / 390) : 90 * S, lane = port ? 5.5 : 12 * S, nL = port ? 3 : 4, edge = 12 + 3 * lane;
  const A = (box.x1 - box.x0) / 2, B = (box.y1 - box.y0) / 2;
  const a = clamp(Math.max(A + m, A * 1.22), 20, Math.max(20, Math.min(cx, W - cx) - edge));
  const b = clamp(B + m, 20, Math.max(20, Math.min(cy, H - cy) - edge));
  let SE = 2.6; while (SE < 4.6 && Math.pow(A / a, SE) + Math.pow(B / b, SE) > 0.8) SE += 0.1;
  const pw = 2 / SE;
  const M = 4096, xs = new Float64Array(M + 1), ys = new Float64Array(M + 1), cum = new Float64Array(M + 1);
  for (let i = 0; i <= M; i++) {
    const th = TAU * i / M, c = Math.cos(th), s = Math.sin(th);
    xs[i] = cx + a * Math.sign(c) * Math.pow(Math.abs(c), pw); ys[i] = cy + b * Math.sign(s) * Math.pow(Math.abs(s), pw);
    if (i) cum[i] = cum[i - 1] + Math.hypot(xs[i] - xs[i - 1], ys[i] - ys[i - 1]);
  }
  const L = cum[M], K = 1024, tab = new Float64Array(K * 2); let j = 0;
  for (let k = 0; k < K; k++) {
    const d = L * k / K; while (j < M - 1 && cum[j + 1] < d) j++;
    const q = (d - cum[j]) / ((cum[j + 1] - cum[j]) || 1);
    tab[k * 2] = xs[j] + (xs[j + 1] - xs[j]) * q; tab[k * 2 + 1] = ys[j] + (ys[j + 1] - ys[j]) * q;
  }

}
const _lp = { x: 0, y: 0, tx: 1, ty: 0 };
function lanePos(u, offs){
  const K = halo.K, t = halo.tab; u = u - Math.floor(u);
  const f = u * K, i = Math.floor(f) % K, q = f - Math.floor(f), i2 = (i + 1) % K, i0 = (i + K - 1) % K, i3 = (i + 2) % K;
  const x = t[i * 2] + (t[i2 * 2] - t[i * 2]) * q, y = t[i * 2 + 1] + (t[i2 * 2 + 1] - t[i * 2 + 1]) * q;
  let tx = t[i3 * 2] - t[i0 * 2], ty = t[i3 * 2 + 1] - t[i0 * 2 + 1]; const l = Math.hypot(tx, ty) || 1; tx /= l; ty /= l;
  _lp.x = x + ty * offs; _lp.y = y - tx * offs; _lp.tx = tx; _lp.ty = ty; return _lp;
}
const DA = 0.3, dens = u => 1 + DA * Math.cos(12.566370614 * u), cdfD = u => u + DA * Math.sin(12.566370614 * u) / 12.566370614;
function densInv(q){ let u = q; for (let i = 0; i < 6; i++) u -= (cdfD(u) - q) / dens(u); return u; }

// ---------- events ----------
const MH = 1.3;           // ring speed as a multiple of cruise (mean of the lane speeds)
const KV = +(Q.get('kv') || 1.8), DMAX = +(Q.get('dmax') || 2.6), VCAP = +(Q.get('vcap') || 7) * 3.4;   // entry pace: average path speed as a multiple of cruise, longest entry, top speed (px per step at S=1)
const LANE_SP = { 3: [1.1, 1, 0.9], 4: [1.12, 1.03, 0.95, 0.88] };   // innermost lane fastest
// entry styles: xt = extra swirl (fraction of cruise x entry time), pt/pn = how late the swirl and the radial drop finish, fill = seconds the ring takes to start filling
const STYLES = [
  { name: 'wind',  xt: 0.55, pt: 1.5, pn: 1.6, fill: 0.0, dmin: 1.6, exit: 'unwind' },
  { name: 'dive',  xt: 0.18, pt: 1.4, pn: 1.3, fill: 0.0, dmin: 1.4, exit: 'burst' },
  { name: 'orbit', xt: 0.95, pt: 2.0, pn: 2.2, fill: 0.5, dmin: 2.0, exit: 'stream' },
  { name: 'sweep', xt: 0.35, pt: 1.6, pn: 1.5, fill: 1.0, dmin: 1.5, exit: 'peel' }
];
let RS = { dir: 1, wa: 0.01, wk: 2, ww: 0.08, ba: 10, bk: 2, bw: 0.5, bp: 0, pt: 1.5, pn: 1.5, rot: 0.09, st: STYLES[0] }, styleI = -1;
const wrap1 = u => u - Math.floor(u + 0.5);
const _rp = { x: 0, y: 0, th: 0, tt: 0, n: 0 };
// a bird's place on the ring at event time e: base phase + travelling density wave, braided lane offset, rotating breathing; k > 0 adds the entry spiral
function ringXY(b, e, k){
  const u0 = b.uS + RS.dir * b.om * e / halo.L;
  const th = u0 + RS.wa * Math.sin(TAU * (RS.wk * u0 - RS.ww * e));
  let n = b.lo + b.wA * Math.sin(TAU * b.wF * u0 + b.psi + b.ws * e) + RS.ba * Math.cos(TAU * RS.bk * u0 - RS.bw * e + RS.bp), tt = th;
  if (k > 0) { tt -= RS.dir * b.dl * Math.pow(k, RS.pt); n += b.n0 * Math.pow(k, b.pn); }
  const p = lanePos(tt, n); _rp.x = p.x; _rp.y = p.y; _rp.th = th; _rp.tt = tt; _rp.n = n; return _rp;
}
const _pj = { u: 0, n: 0 };
function projectRing(x, y){
  const K = halo.K, t = halo.tab; let bi = 0, bd = 1e18;
  for (let i = 0; i < K; i++) { const dx = t[i * 2] - x, dy = t[i * 2 + 1] - y, d = dx * dx + dy * dy; if (d < bd) { bd = d; bi = i; } }
  const i0 = (bi + K - 1) % K, i2 = (bi + 1) % K; let tx = t[i2 * 2] - t[i0 * 2], ty = t[i2 * 2 + 1] - t[i0 * 2 + 1]; const l = Math.hypot(tx, ty) || 1; tx /= l; ty /= l;
  _pj.u = bi / K; _pj.n = (x - t[bi * 2]) * ty - (y - t[bi * 2 + 1]) * tx; return _pj;
}
// a halo bird's entry, worked out in ring space (u along the ring, n across it) from where the bird really is when it joins:
// straight flight and the spiral blend in (u, n), so no bird ever cuts a chord across the word
function enterRing(b, e){
  const CRs = 3.4 * S * 60, L = halo.L, pj = projectRing(b.x, b.y); b.pu = pj.u; b.pn0 = pj.n;
  const d = 0.002, q0 = lanePos(b.pu - d, b.pn0), x0 = q0.x, y0 = q0.y, q1 = lanePos(b.pu + d, b.pn0), h = Math.max(Math.hypot(q1.x - x0, q1.y - y0) / (2 * d), 0.4 * L);
  const c = lanePos(b.pu, b.pn0), vx = b.vx * 60, vy = b.vy * 60;
  b.vt = (vx * c.tx + vy * c.ty) / h; b.vn = vx * c.ty - vy * c.tx; b.ex = b.x - c.x; b.ey = b.y - c.y;
  b.pn = b.pn0 < -24 * S ? 3 : RS.pn;

  b.wM = Math.round(thE - RS.dir * b.dl - b.pu);
  const g0 = wrap1(thE - b.pu) * L, no = Math.abs(b.n0); let D = RS.st.dmin;
  for (let i = 0; i < 4; i++) D = clamp(Math.hypot(Math.abs(g0 + RS.dir * b.om * D), no) / (KV * CRs), RS.st.dmin, DMAX);

}
let queue = [], lastWord = -1e9, lastCode = 0;
function evColor(ev){ return ev.kind === 'join' ? T.players[ev.seat % 8] : ev.kind === 'code' ? T.code : T.win; }
function codeEvent(){ return { kind: 'code', lines: [(Q.get('code') || 'ERVY').toUpperCase()] }; }
function joinEvent(name){
  name = (name || 'Player').trim().slice(0, 12) || 'Player';
  let idx = players.findIndex(p => p.name === name), fresh = false;
  if (idx < 0) { idx = players.length; players.push({ name, seat: idx }); fresh = true; }
  const ev = { kind: 'join', name, idx, seat: players[idx].seat, lines: [name.toUpperCase()] };
  if (fresh) ev.onStart = () => {
    const pool = birds.filter(b => b.own < 0); let n = 28;
    while (n-- && pool.length) { const b = pool.splice(Math.floor(rnd() * pool.length), 1)[0]; b.own = idx; b.home = homeCol(b); if (b.role === 'free') setCol(b, b.home, 0, 0.5); }
  };
  return ev;
}
function winEvent(name){
  name = (name || (players.length ? players[players.length - 1].name : 'Cleo')).toUpperCase();
  return { kind: 'win', name, lines: H > W ? [name, 'WINS'] : [name + ' WINS'] };
}
const NAMES = ['Ana','Ben','Cleo','Dev','Eli','Fay','Gus','Hana'];
let joinI = 0;
const evLog = [];

function startEvent(ev){
  if (ev.onStart) ev.onStart();
  const pts = textPoints(ev.lines);
  const bcx = (box.x0 + box.x1) / 2, bcy = (box.y0 + box.y1) / 2;
  buildHalo();
  const CRs = 3.4 * S * 60, rgb = hex(evColor(ev));
  const excl = b => ev.kind === 'win' ? b.own >= 0 : (ev.kind === 'join' && b.own === ev.idx);
  const cand = birds.filter(b => !excl(b));
  for (const b of cand) b.d = Math.hypot(b.x - bcx, b.y - bcy);
  cand.sort((p, q) => p.d - q.d);
  const word = cand.slice(0, pts.length), wset = new Set(word), hal = birds.filter(b => !wset.has(b));
  pts.sort((p, q) => p[0] - q[0]); word.sort((p, q) => p.x - q.x);
  const amp = H > W ? 1.2 : 1.6;
  const begin = (b, role, ts, D) => {
    b.ts = ts; b.D = D; b.trav = true; b.leaveAt = Infinity; b.boost = 1; b.turnT = 0;
    b.p0x = b.x; b.p0y = b.y; b.v0x = b.vx * 60; b.v0y = b.vy * 60;
    if (ts <= 0) { b.role = role; b.pend = null; } else b.pend = role;
  };
  word.forEach((b, i) => {
    const f = i / Math.max(1, word.length - 1), end = 1.15 + 0.45 * f, ts = b.role === 'free' ? 0.3 : 0;
    begin(b, 'word', ts, end - ts);
    b.tgt = pts[i]; b.p1x = pts[i][0]; b.p1y = pts[i][1]; b.v1x = 0; b.v1y = 0; b.amp = amp; b.fq = 0.7 + rnd3() * 0.4; b.bp = rnd3() * 6.283; b.f = f;
    setCol(b, rgb, 0.3, 0.7);
  });
  halo.n = hal.length;
  // this event's ring: a style that differs from the last one, its own direction, density wave, breathing and braid
  const fixed = Q.get('style'); styleI = fixed !== null ? ((parseInt(fixed, 10) || 0) % 4 + 4) % 4 : styleI < 0 ? Math.floor(rnd2() * 4) : (styleI + 1 + Math.floor(rnd2() * 3)) % 4;
  const st = STYLES[styleI], sgn = () => rnd2() < 0.5 ? -1 : 1;
  RS = { dir: rnd2() < 0.65 ? 1 : -1, wa: 0.006 + rnd2() * 0.005, wk: 2 + Math.floor(rnd2() * 2), ww: (0.05 + rnd2() * 0.09) * sgn(), wf: 2 + Math.floor(rnd2() * 3),
    ba: halo.m * (0.14 + rnd2() * 0.1), bk: 1 + Math.floor(rnd2() * 2), bw: (0.35 + rnd2() * 0.45) * sgn(), bp: rnd2() * TAU, pt: st.pt, pn: st.pn, rot: 0.07 + rnd2() * 0.06, s0: rnd2(), st };
  const nL = halo.nL, lsp = LANE_SP[nL], tRef = 1.5; let ringEnd = 0;
