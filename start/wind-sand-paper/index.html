<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wind and Sand</title>
<style>
:root{--ui:#e9e6ff}
html,body{margin:0;height:100%;background:#0f1020;overflow:hidden;font-family:system-ui,Segoe UI,Arial,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:5px;flex-wrap:nowrap;justify-content:center;opacity:.6}
#hud:hover,#hud:focus-within{opacity:1}
#hud button{font:700 12px system-ui,sans-serif;color:var(--ui);background:rgba(20,16,50,.72);border:1px solid rgba(233,230,255,.45);border-radius:999px;padding:5px 10px;min-height:28px;cursor:pointer;white-space:nowrap}
#hud button:focus-visible{outline:3px solid #ffd166}
#live{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.kiosk #hud{display:none}
</style></head>
<body>
<canvas id="c" aria-label="A sand cast of a card that the wind blows away to reveal it"></canvas>
<div id="live" role="status" aria-live="polite"></div>
<div id="hud"><button data-k="truth">truth</button><button data-k="sh">hitler</button><button data-k="night">night</button><button data-k="imp">imposter</button><button data-k="door">door</button><button data-k="fakeout">fake-out</button><button data-k="round">round</button><button data-k="dawn">dawn</button><button id="bMat">sand</button><button id="bPaper">tear</button><button id="bTheme">theme</button></div>
<script>
(() => {
'use strict';
const Q = new URLSearchParams(location.search);
const INK = '#1a0b12', LIGHT = '#fff7fb';
const THEMES = {
  pop: { flat: true, bg: '#0f1020', bg2: null, far: '#3b2d4f', mid: '#7a5140', near: '#d5963d', rim: null, outline: INK,
    sand: ['#ffd166', '#e8a93e', '#b8742a'], speck: '#8f5720', card: LIGHT, card2: LIGHT, ink: INK,
    paper: { face: '#e6b872', fib: '#c48f4e', panel: '#f8dea6', rim: '#fff4dc', back: '#f3e2bd', ink: INK },
    accent: { truth: '#06d6a0', sh: '#ff5d8f', night: '#b388ff', imp: '#4cc9f0', door: '#ffd166' }, ui: '#f5f6ff' },
  gouache: { flat: false, bg: '#0f1230', bg2: '#1b2350', far: '#2b2f57', mid: '#4a4668', near: '#af9b7c', rim: '#e9d29c', outline: null,
    sand: ['#e9d7ad', '#cbb48c', '#8a7b86'], speck: '#8a7b86', card: '#e9dcc0', card2: '#d6c5a0', ink: '#2b2350',
    paper: { face: '#d9c49c', fib: '#b09b78', panel: '#eadcba', rim: '#f6eed8', back: '#e6d8b8', ink: '#2b2350' },
    accent: { truth: '#7fb8ad', sh: '#c9788f', night: '#8f8fd0', imp: '#7a9ad0', door: '#d9b46a' }, ui: '#e8e2ff' }
};
let themeName = Q.get('theme') === 'gouache' ? 'gouache' : 'pop';
let T = THEMES[themeName];
const reduced = Q.get('motion') === '0' || (matchMedia('(prefers-reduced-motion: reduce)').matches && Q.get('motion') !== '1');
if (Q.has('kiosk')) document.documentElement.classList.add('kiosk');
const DIR = Q.get('dir') === '-1' ? -1 : 1;
const HOLDFLAG = Q.has('hold') && Q.get('hold') !== '0';
let MAT = (Q.get('mat') === 'paper' || Q.has('paper')) ? 'paper' : 'sand', PAPER = Q.get('paper') === 'shred' ? 'shred' : 'tear';
const ROLE = Q.get('role') === 'liberal' ? 'liberal' : 'fascist';

// timeline (seconds after fire)
const T_ANT = 0.15, T_RISE = 0.85, T_SET = 1.15, T_HOLD = 2.15, T_WIND = 2.35, T_THIN = 2.95, T_THICK = 3.40, T_PEAK = 3.50, T_SETTLE = 4.45, T_SHOWN = 7.35, T_END = 7.95;

function prng(seed){ let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const seed = parseInt(Q.get('seed') || '20260928', 10);
let rnd = prng(seed), rndG = prng(seed ^ 0x9e3779b9), rndD = prng(seed ^ 0x51ed270b), rndC = prng(seed ^ 0x2c1b3c6d);

const NT = 64, nTab = Array.from({ length: NT * NT }, () => rnd());
const sm = t => t * t * (3 - 2 * t);
function vn(x, y){ const xi = Math.floor(x), yi = Math.floor(y), fx = sm(x - xi), fy = sm(y - yi);
  const g = (a, b) => nTab[((b % NT + NT) % NT) * NT + ((a % NT + NT) % NT)];
  return (g(xi, yi) * (1 - fx) + g(xi + 1, yi) * fx) * (1 - fy) + (g(xi, yi + 1) * (1 - fx) + g(xi + 1, yi + 1) * fx) * fy; }
const fbm = (x, y) => vn(x, y) * 0.55 + vn(x * 2.1 + 7, y * 2.1 + 3) * 0.3 + vn(x * 4.3 + 1, y * 4.3 + 9) * 0.15;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);

const cv = document.getElementById('c'), ctx = cv.getContext('2d', { alpha: false });
const live = document.getElementById('live');
let W = 0, H = 0, S = 1, DPR = 1, cs = 4, portrait = false;

// ---------- state ----------
let tt = -1;            // seconds since fire; -1 = idle
let kind = null, held = HOLDFLAG, cast = null, clock = 0;
let grains = [], wisps = [], dep = [], wispT = 0, windFired = false, poofDone = false;
let peakBurst = false, RV = null, fireN = 0;
const STREAKS = new Map();
const MAXG = 1200;

const KINDS = {
  truth: { wide: true, title: 'THE TRUTH', big: ['Flamingos are', 'born grey.'], sub: [], tag: 'TRUE', say: 'The truth: flamingos are born grey.' },
  sh: { title: 'SECRET ROLE', big: [ROLE === 'liberal' ? 'LIBERAL' : 'FASCIST'], sub: ROLE === 'liberal' ? ['You are on the good side.', 'Find the Fascists.'] : ['Your team: Ben, Cleo', 'Hitler: Dev'], say: ROLE === 'liberal' ? 'Your secret role: Liberal.' : 'Your secret role: Fascist.' },
  night: { title: 'NIGHTFALL', big: ['WEREWOLF'], sub: ['Wake at night.', 'Pick a victim.'], say: 'Your secret role: Werewolf.' },
  imp: { title: 'YOUR WORD', big: ['IMPOSTER'], sub: ['You do not know the word.', 'Blend in.'], say: 'You are the imposter.' },
  door: { title: 'MYSTERY BOX', big: ['DOOR 3'], sub: ['Behind it waits', 'a golden key.'], say: 'Mystery Box: door 3. Behind it waits a golden key.' }
};
const FONT = '"Segoe UI",system-ui,Arial,sans-serif';

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight; portrait = H > W;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  S = Math.max(Math.min(W / 1920, H / 1080) * (portrait ? 1.9 : 1), 0.6);
  cs = Math.max(4, Math.round(Math.min(W, H) / 170));
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  bgGrad = null; stars = null; dep = new Array(Math.ceil(W / 16) + 3).fill(0);
  if (cast) { const k = cast.kind, t = tt; layout(k); tt = t; renderAssets(); eraseAny(tt); }
  if (scene) restoreScene();
}
let bgGrad = null, stars = null;
const GMAX = () => (portrait ? 600 : 1600) * (scene ? 1.4 : 1);

// ---------- near dune surface ----------
const nearMean = () => H * (portrait ? 0.74 : 0.84);
function depAt(x){ const f = clamp(x / 16, 0, dep.length - 2), i = Math.floor(f), a = f - i; return dep[i] * (1 - a) + dep[i + 1] * a; }
function riseP(t){
  if (t < T_ANT) return 0;
  if (t < 0.75) { const q = (t - T_ANT) / 0.6; return 1.03 * (1 - Math.pow(1 - q, 1.3)); }
  if (t < T_RISE) return 1.03 - 0.03 * sm((t - 0.75) / 0.1);
  return 1;
}
function plateauG(){ if (tt < 0) return 0; if (tt < T_END) return clamp(riseP(tt), 0, 1); return 1 - clamp((tt - T_END) / 0.5, 0, 1); }
function bodyDY(){
  if (!cast || reduced) return 0;
  const D = cast.h + cast.foot + 0.04 * H;
  if (MAT === 'paper' && tt < T_RISE) return -(cast.Yf + 14) * (1 - sm(clamp((tt - T_ANT) / (T_RISE - T_ANT), 0, 1)));
  if (tt < T_RISE) return (1 - riseP(tt)) * D;
  if (tt >= T_SHOWN && !cast.noSink) { const k = clamp((tt - T_SHOWN) / (T_END - T_SHOWN), 0, 1); return k * k * D; }
  return 0;
}
function plat(y, x, k, g, t){
  const d = Math.max(0, Math.abs(x - (k.x + k.w / 2)) - k.w / 2), A = (portrait ? 24 : 40) * 2.2, w = 1 - sm(clamp(d / A, 0, 1));
  y += w * (k.Yf - y) * g;
  if (t >= 0 && t < T_RISE) y -= w * (portrait ? 4 : 6) * (t < T_ANT ? t / T_ANT : Math.max(0, 1 - g));
  return y;
}
function surface(x){
  let y = nearMean() + Math.sin(x * 0.0045 + clock * 0.12 + 1.3) * H * 0.012 + Math.sin(x * 0.013 - clock * 0.2) * H * 0.004;
  if (scene) for (const c of scene.cards) y = plat(y, x, c, c.g, c.t);
  else if (cast) y = plat(y, x, cast, plateauG(), tt);
  return y - depAt(x);
}

// ---------- layout ----------
function fitSize(text, maxW, size, weight, min){
  const c = fitSize.c || (fitSize.c = document.createElement('canvas').getContext('2d'));
  c.font = `${weight} ${size}px ${FONT}`;
  while (c.measureText(text).width > maxW && size > min) { size -= 1; c.font = `${weight} ${size}px ${FONT}`; }
  return size;
}
function layout(k){
  kind = k; const spec = KINDS[k], wide = !!spec.wide, u = portrait ? 1 : H / 1080;
  let cw, ch;
  if (portrait) { cw = W * 0.84; ch = wide ? Math.min(H * 0.56, cw) : Math.min(H * 0.56, cw * 1.44); }
  else if (wide) { cw = 1000 * u; ch = 670 * u; } else { cw = 540 * u; ch = 760 * u; }
  cw = Math.round(cw); ch = Math.round(ch);
  const Yf = Math.round(nearMean() - 0.02 * H), cx = Math.round((W - cw) / 2), cy = Yf - ch;
  const ov = portrait ? 4 : 6, foot = Math.round(ch * 0.07);
  const rimIn = 0.04 * cw, rimT = portrait ? 8 : Math.round(14 * u), inner = cw - 2 * (rimIn + rimT);
  const tSize = portrait ? Math.max(14, ch * 0.045) : 36 * u, subSize = portrait ? 18 : 36 * u;
  const plW = inner * (wide ? 0.92 : 0.8);
  let bigSize = portrait ? (wide ? 40 : 36) : (wide ? 96 : 88) * u;
  for (const l of spec.big) bigSize = fitSize(l, plW * 0.94, bigSize, 900, portrait ? 30 : 60 * u);
  const nl = spec.big.length, plH = wide ? bigSize * (nl * 1.15 + 0.35) : bigSize * 1.5;
  const L = { rimIn, rimT, inner, stripY: portrait ? 0.085 * ch : 0.085 * ch, stripH: Math.max(4, 0.012 * ch + 2), titleY: 0.155 * ch, tSize,
    med: wide ? null : { x: cw / 2, y: 0.335 * ch, r: cw * 0.19 }, bigSize, subSize,
    plaque: { x: cw / 2, y: (wide ? 0.46 : 0.635) * ch, w: plW, h: plH },
    subs: wide ? [] : [{ y: 0.775 * ch, w: inner * 0.7 }, { y: 0.845 * ch, w: inner * 0.45 }],
    stamp: wide ? { x: cw / 2, y: 0.815 * ch, w: cw * 0.34, h: ch * 0.15 } : null };
  cast = { kind: k, x: cx, y: cy, w: cw, h: ch, ov, foot, bx: cx - ov, by: cy - ov, bw: cw + 2 * ov, bh: ch + 2 * ov + foot, Yf, L, u,
    cells: [], ptr: 0, total: 0, eroded: 0 };
  if (MAT === 'sand') buildCells(); else { cast.cells = []; cast.total = 0; cast.ptr = 0; }
  buildRiver();
  tt = 0; grains = grains.filter(g => g.amb); wisps = []; windFired = false; peakBurst = false; poofDone = false; wispT = 0;
}
function inCast(px, py, m){
  const c = cast, ov = c.ov, r = Math.min(c.w, c.h) * 0.07, hw = c.w / 2, hh = c.h / 2, x = px - ov - hw, y = py - ov - hh;
  const dx = Math.max(Math.abs(x) - (hw - r), 0), dy = Math.max(Math.abs(y) - (hh - r), 0);
  return Math.hypot(dx, dy) <= r + ov * 0.8 + (m || 0);
}
function buildCells(){
  const c = cast, L = c.L, ov = c.ov, cols = Math.ceil(c.bw / cs), rows = Math.ceil((c.h + 2 * ov) / cs), list = [];
  const rq = prng((seed ^ 0x7f4a7c15) + (c.sid || 0) * 7789), sid = (c.sid || 0) * 11.3;
  const pl = L.plaque, m = L.med, s0 = L.subs[0], s1 = L.subs[L.subs.length - 1];
  for (let r = 0; r < rows; r++) for (let q = 0; q < cols; q++) {
    const px = q * cs + cs / 2, py = r * cs + cs / 2;
    if (!inCast(px, py, cs * 0.9)) continue;
    const x = px - ov, y = py - ov, u = clamp(DIR > 0 ? x / c.w : 1 - x / c.w, 0, 1), v = clamp(y / c.h, 0, 1);
    // depth 0..1 = how far inside a thick region (plaque, medallion, subtitles) the cell sits; the region erodes from its rim inward
    let depth = 0;
    const dpl = Math.min(pl.w / 2 - Math.abs(x - pl.x), pl.h / 2 - Math.abs(y - pl.y)) + cs;
    if (dpl > 0) depth = Math.max(depth, clamp(dpl / (pl.h * 0.5), 0, 1));
    if (m) { const dm = m.r + cs - Math.hypot(x - m.x, y - m.y); if (dm > 0) depth = Math.max(depth, clamp(dm / m.r, 0, 1)); }
    if (s0 && Math.abs(x - c.w / 2) <= L.inner / 2 && y >= s0.y - L.subSize && y <= s1.y + L.subSize) depth = Math.max(depth, 0.45);
    const thick = depth > 0;

    const fr = clamp(u * 0.84 + 0.12 * (v - 0.5) + 0.34 * (fbm(x * 0.011 + 3 + sid, y * 0.014 + 8) - 0.5) + 0.14 * (vn(x * 0.035 + 5, y * 0.05 + 1) - 0.5) + (rq() - 0.5) * 0.05, 0, 1);
    const te = T_WIND + (T_THICK - 0.25 - T_WIND) * fr + depth * 0.15 * (0.4 + 0.9 * fbm(x * 0.03 + 9, y * 0.03 + 2));
    list.push([px, py, te, thick ? 1 : 0]);
  }
  list.sort((a, b) => a[2] - b[2]);
  c.cells = list; c.total = list.length; c.ptr = 0;
}
// The river is a channel: a centreline (y) and a half-width (w) through pivot gates, in "u" = distance along the wind.
// A grain keeps its lane eta (= offset / width), so its path is centreline + eta * width: streamlines never cross, they squeeze
// through the pinch gates and fan out between them. Smoothstep between gates = zero slope at every gate (a slalom).
let rvY = 0, rvW = 1;
function buildRiver(){
  const fx = portrait ? [0.20, 0.42, 0.62, 0.78, 0.90, 1.02, 1.14] : [0.30, 0.52, 0.74, 0.83, 0.90, 0.97, 1.05, 1.14];
  const fy = portrait ? [0.44, 0.38, 0.30, 0.22, 0.15, 0.09, 0.05] : [0.50, 0.47, 0.42, 0.34, 0.54, 0.38, 0.52, 0.40];
  const fw = portrait ? [0.30, 0.26, 0.20, 0.09, 0.05, 0.07, 0.05] : [0.36, 0.34, 0.30, 0.13, 0.05, 0.12, 0.04, 0.10];
  const q = prng((seed ^ 0x3c6ef372) + fireN * 7919), n0 = fx.length;
  for (let i = 0; i < n0; i++) { fx[i] += i && i < n0 - 1 ? (q() - 0.5) * 0.03 : 0; fy[i] += (q() - 0.5) * (i < 2 ? 0.05 : 0.11); fw[i] *= 0.8 + q() * 0.45; if (MAT === 'paper') fw[i] = Math.max(fw[i] * 1.4, portrait ? 0.11 : 0.12); }
  const gx = fx.map(f => f * W), gy = fy.map(f => f * H), gw = fw.map(f => f * H), N = 160, u1 = W * 1.3, du = u1 / N;
  const tY = new Float32Array(N + 1), tW = new Float32Array(N + 1), n = gx.length;
  for (let i = 0; i <= N; i++) {

    if (u <= gx[0]) { tY[i] = gy[0]; tW[i] = gw[0]; } else if (k >= n - 1) { tY[i] = gy[n - 1]; tW[i] = gw[n - 1]; }
    else { const a = sm(clamp((u - gx[k]) / (gx[k + 1] - gx[k]), 0, 1)); tY[i] = gy[k] + (gy[k + 1] - gy[k]) * a; tW[i] = gw[k] + (gw[k + 1] - gw[k]) * a; }

function riverAt(u){
  const R = RV, f = clamp(u / R.du, 0, R.N - 1.001), i = f | 0, a = f - i;
  rvY = R.tY[i] * (1 - a) + R.tY[i + 1] * a; rvW = R.tW[i] * (1 - a) + R.tW[i + 1] * a;
}
function riverTick(){}

// ---------- assets: sand cast, relief, card ----------
function mk(w, h){ const b = document.createElement('canvas'); b.width = Math.round(w * DPR); b.height = Math.round(h * DPR); const c = b.getContext('2d'); c.setTransform(DPR, 0, 0, DPR, 0, 0); return [b, c]; }
function rr(c, x, y, w, h, r){ c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function emb(c, fn, o, face, dark, lit, rule){
  c.save(); c.fillStyle = lit; c.translate(o * 0.8, -o * 0.8); fn(c); c.fill(rule); c.restore();
  c.save(); c.fillStyle = dark; c.translate(-o * 1.5, o * 1.5); fn(c); c.fill(rule); c.restore();
  c.fillStyle = face; fn(c); c.fill(rule);
}
function embText(c, txt, x, y, size, wt, o, face, dark, lit){
  c.font = `${wt} ${size}px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillStyle = lit; c.fillText(txt, x + o * 0.8, y - o * 0.8); c.fillStyle = dark; c.fillText(txt, x - o * 1.5, y + o * 1.5); c.fillStyle = face; c.fillText(txt, x, y);
}
function groove(c, x1, y1, x2, y2, lw, o, dark, lit){
  c.lineCap = 'round'; c.lineWidth = lw;
  c.strokeStyle = lit; c.beginPath(); c.moveTo(x1 - o * 0.8, y1 + o * 0.8); c.lineTo(x2 - o * 0.8, y2 + o * 0.8); c.stroke();
  c.strokeStyle = dark; c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke();
}
function drawIcon(c, k, x, y, s, ac){
  c.save(); c.translate(x, y); c.fillStyle = ac; c.strokeStyle = T.flat ? T.outline : 'rgba(30,20,50,.5)'; c.lineWidth = T.flat ? 3 * S + 1 : 2;
  if (k === 'sh') { // hooded figure
    c.beginPath(); c.moveTo(-s * 0.9, s * 0.9); c.quadraticCurveTo(-s * 0.95, -s * 0.1, 0, -s * 1.0); c.quadraticCurveTo(s * 0.95, -s * 0.1, s * 0.9, s * 0.9); c.closePath(); c.fill(); c.stroke();
    c.fillStyle = T.ink; c.beginPath(); c.ellipse(0, -s * 0.05, s * 0.45, s * 0.5, 0, 0, 6.283); c.fill();
    c.fillStyle = T.card; c.beginPath(); c.arc(-s * 0.17, -s * 0.1, s * 0.09, 0, 6.283); c.arc(s * 0.17, -s * 0.1, s * 0.09, 0, 6.283); c.fill();
  } else if (k === 'night') { // crescent moon + stars
    c.beginPath(); c.arc(0, 0, s * 0.85, 0, 6.283); c.fill(); c.stroke();
    c.fillStyle = T.card; c.beginPath(); c.arc(s * 0.42, -s * 0.2, s * 0.72, 0, 6.283); c.fill();
    c.fillStyle = T.ink; for (const [px, py, pr] of [[0.55, -0.6, 0.09], [0.85, 0.15, 0.07], [0.5, 0.65, 0.06]]) { c.beginPath(); c.arc(s * px, s * py, s * pr, 0, 6.283); c.fill(); }
  } else if (k === 'imp') { // masked face
    c.beginPath(); c.arc(0, 0, s * 0.85, 0, 6.283); c.fill(); c.stroke();
    c.fillStyle = T.ink; c.beginPath(); c.ellipse(-s * 0.32, -s * 0.15, s * 0.22, s * 0.11, -0.2, 0, 6.283); c.ellipse(s * 0.32, -s * 0.15, s * 0.22, s * 0.11, 0.2, 0, 6.283); c.fill();
    c.font = `900 ${s * 0.7}px system-ui,Arial,sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('?', 0, s * 0.42);
  } else if (k === 'door') { // arched door
    c.beginPath(); c.moveTo(-s * 0.6, s * 0.95); c.lineTo(-s * 0.6, -s * 0.2); c.arc(0, -s * 0.2, s * 0.6, Math.PI, 0); c.lineTo(s * 0.6, s * 0.95); c.closePath(); c.fill(); c.stroke();
    c.fillStyle = T.ink; c.beginPath(); c.arc(s * 0.32, s * 0.4, s * 0.07, 0, 6.283); c.fill();
    c.fillStyle = T.card; c.globalAlpha = 0.85; c.fillRect(-s * 0.5, s * 0.86, s * 1.0, s * 0.06); c.globalAlpha = 1;
  }
  c.restore();
}

// ---------- boot ----------
let last = 0, fpsN = 0, fpsT = 0;
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(0.5, (now - last) / 1000 || 0.016); last = now;
  update(dt); render();
  fpsN++; if (now - fpsT > 1000) { window.__fps = fpsN * 1000 / (now - fpsT); fpsN = 0; fpsT = now; }
}
function setTheme(name){
  themeName = name; T = THEMES[name]; bgGrad = null; document.documentElement.style.setProperty('--ui', T.ui);
  const u = new URL(location.href); u.searchParams.set('theme', name); history.replaceState(null, '', u);
  if (cast) {
    const t = tt, g = grains, w = wisps, wf = windFired, pb = peakBurst, ad = antDone, sd = stampDone, ed = exitDone;
    layout(cast.kind); grains = g; wisps = w; windFired = wf; peakBurst = pb; antDone = ad; stampDone = sd; exitDone = ed;
    tt = t; renderAssets(); eraseAny(tt);
  }
  if (scene) restoreScene();
  initAmbient();
}
function coverage(){
  const k = cast; if (!k) return null;
  return { ptr: k.ptr, total: k.total, eroded: +(k.ptr / k.total).toFixed(4), cardDrawn: k.ptr >= k.total && tt >= T_THICK };
}
addEventListener('resize', () => { resize(); initAmbient(); });
document.querySelectorAll('#hud [data-k]').forEach(b => b.onclick = () => fire(b.dataset.k));
document.getElementById('bTheme').onclick = () => setTheme(themeName === 'pop' ? 'gouache' : 'pop');
const bMat = document.getElementById('bMat'), bPaper = document.getElementById('bPaper');
function syncHud(){ bMat.textContent = MAT; bPaper.textContent = PAPER; bPaper.style.display = MAT === 'paper' ? '' : 'none'; }
function again(){ syncHud(); fire(scene ? scene.type : cast ? cast.kind : (kind || 'truth')); }
bMat.onclick = () => { MAT = MAT === 'sand' ? 'paper' : 'sand'; again(); };
bPaper.onclick = () => { PAPER = PAPER === 'tear' ? 'shred' : 'tear'; again(); };
syncHud();
document.documentElement.style.setProperty('--ui', T.ui);
resize(); initAmbient();
for (let i = 0; i < 40; i++) stepGrains(0.016);
if (Q.get('fire')) setTimeout(() => fire(Q.get('fire'), Q.get('hold') ? false : true), 300);
// The first fire on a cold page makes the GPU compile its shaders and rasterise the new canvases: 60 to 180 ms of frozen frames.
// Pay that now, while nobody is watching: one throw-away card per material, then every piece of state goes back (own RNGs, so real fires are unchanged).
function warmOne(mat, paper){
  if (cast || scene || fireN) return;
  const keep = [scene, fireN, kind, cast, tt, grains, wisps, windFired, peakBurst, poofDone, wispT, RV, held, antDone, stampDone, exitDone, landDone, accP, accH, MAT, PAPER, rnd, rndG, rndD, rndC];
  rnd = prng(11); rndG = prng(12); rndD = prng(13); rndC = prng(14); MAT = mat; PAPER = paper;
  try {
    fire('truth', true);
    for (const v of Object.values(cast)) if (v instanceof HTMLCanvasElement) v.getContext('2d').getImageData(0, 0, 1, 1);
  } finally {
    [scene, fireN, kind, cast, tt, grains, wisps, windFired, peakBurst, poofDone, wispT, RV, held, antDone, stampDone, exitDone, landDone, accP, accH, MAT, PAPER, rnd, rndG, rndD, rndC] = keep;
  }
}
if (!reduced && Q.get('warm') !== '0') [MAT + ':' + PAPER, 'sand:tear', 'paper:tear', 'paper:shred'].filter((v, i, a) => a.indexOf(v) === i).forEach((v, i) => setTimeout(() => warmOne(...v.split(':')), 600 + 450 * i));
window.__sand = {
  fire, reveal, theme: setTheme, coverage, fps: () => window.__fps, grains: () => grains.length,
  material: (m, p) => { if (m) MAT = m === 'paper' ? 'paper' : 'sand'; if (p) PAPER = p === 'shred' ? 'shred' : 'tear'; syncHud(); },
  cardDrawn: () => scene ? scene.sT >= 0 : !!cast && cast.ptr >= cast.total && tt >= T_THICK,
  baseURL: () => cast ? cast.base.toDataURL('image/png') : null,
  leftover: () => { if (scene) return sceneLeft(); const k = cast; if (!k) return null; const lim = Math.round((k.ov + k.h - 1) * DPR); const cnt = c => { const w = c.canvas.width, d = c.getImageData(0, 0, w, lim).data; let n = 0; const pts = []; for (let i = 3; i < d.length; i += 4) if (d[i] > 8) { n++; if (n % 7 === 1 && pts.length < 12) { const p = (i - 3) / 4; pts.push([Math.round(p % w / DPR), Math.round(((p / w) | 0) / DPR)]); } } return { n, pts }; }; return { base: cnt(k.bc), rel: cnt(k.rc), ptr: k.ptr, total: k.total, tt: +tt.toFixed(2) }; },
  phase: () => scene ? 'scene' : !cast ? 'idle' : tt < T_RISE ? 'rise' : tt < T_HOLD ? 'cast' : tt < T_THICK ? 'wind' : tt < T_SHOWN ? 'shown' : 'sink',
  state: () => ({ scene: scene && { type: scene.type, S: +scene.S.toFixed(3), sT: scene.sT, allGone: scene.allGone, cards: scene.cards.map(c => ({ kind: c.kind, t: +c.t.toFixed(2), g: +c.g.toFixed(2), ptr: c.ptr, total: c.total, gone: c.gone, alpha: +c.alpha.toFixed(2) })) }, tt: +tt.toFixed(3), mat: MAT, paper: PAPER, kind: cast && cast.kind, held, ptr: cast ? cast.ptr : 0, total: cast ? cast.total : 0, grains: grains.length, dep: Math.max(0, ...dep), portrait, reduced, dir: DIR, cell: cs,
    cast: cast && { x: cast.x, y: cast.y, w: cast.w, h: cast.h, Yf: cast.Yf, foot: cast.foot }, L: cast && cast.L, surfaceAtCast: cast ? surface(cast.x + cast.w / 2) : null, dy: cast ? bodyDY() : 0 })
};
if (reduced) { render(); let lt = performance.now(); setInterval(() => { const n = performance.now(); update(Math.min(0.5, (n - lt) / 1000)); lt = n; render(); }, 100); }
else requestAnimationFrame(frame);
})();
</script></body></html>
