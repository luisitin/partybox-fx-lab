<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Party Board Camera</title>
<meta name="description" content="PartyBox fx-lab F05: a party-board camera on a floating island. One offline page, three.js inlined.">
<style>
:root {
  --pb-bg: #0f1020;
  --pb-surface: #1c1e3a;
  --pb-surface-2: #272a52;
  --pb-text: #f5f6ff;
  --pb-text-muted: #b3b7d9;
  --pb-accent: #ff5d8f;
  --pb-accent-2: #ffd166;
  --pb-accent-3: #06d6a0;
  --pb-danger: #ef476f;
  --pb-info: #4cc9f0;
  --pb-on-accent: #1a0b12;
  --pb-player-1: #ff5d8f;
  --pb-player-2: #ffd166;
  --pb-player-3: #06d6a0;
  --pb-player-4: #4cc9f0;
  --pb-space-1: 4px;
  --pb-space-2: 8px;
  --pb-space-3: 12px;
  --pb-space-4: 16px;
  --pb-space-5: 24px;
  --pb-space-6: 32px;
  --pb-space-7: 48px;
  --pb-space-8: 64px;
  --pb-radius-1: 12px;
  --pb-radius-2: 24px;
  --pb-touch: 44px;
  --pb-motion-fast: 150ms;
  --pb-motion: 300ms;
  --pb-motion-slow: 600ms;
  --pb-ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --pb-font: 'Nunito Variable', 'Segoe UI Variable Display', 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
  /* TV scale: 1 at 1920 x 1080, set by the page on resize */
  --u: 1;
  --panel: rgba(22, 24, 50, 0.86);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--pb-bg);
  color: var(--pb-text);
  font-family: var(--pb-font);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
canvas.board { display: block; width: 100%; height: 100%; }
body.tv canvas.board { position: fixed; inset: 0; }
.fail { position: fixed; inset: 0; display: grid; place-items: center; padding: 32px; text-align: center; font-size: 24px; }

/* ---------- TV ---------- */
.hud-tv { position: fixed; inset: 0; pointer-events: none; }
.hud-tv .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 75% 70% at 50% 46%, transparent 62%, rgba(8, 10, 32, 0.38) 100%); }
.hud-tv .pb-header {
  position: absolute; top: calc(24px * var(--u)); left: calc(32px * var(--u)); right: calc(32px * var(--u));
  display: flex; align-items: center; justify-content: space-between;
}
.brand { display: flex; align-items: center; gap: calc(12px * var(--u)); }
.hud-tv .brand { padding: calc(8px * var(--u)) calc(24px * var(--u)) calc(8px * var(--u)) calc(10px * var(--u)); background: var(--panel); border-radius: calc(24px * var(--u)); box-shadow: 0 calc(6px * var(--u)) calc(18px * var(--u)) rgba(5, 6, 20, 0.35); }
.hud-tv .mark { width: calc(52px * var(--u)); height: calc(52px * var(--u)); }
.brand-name { font-weight: 900; letter-spacing: 0.01em; }
.brand-game { color: var(--pb-text-muted); font-weight: 700; }
.hud-tv .brand-name, .hud-tv .brand-game { font-size: calc(32px * var(--u)); }
.status { font-weight: 800; }
.hud-tv .status { font-size: calc(32px * var(--u)); padding: calc(10px * var(--u)) calc(24px * var(--u)); background: var(--panel); border-radius: calc(24px * var(--u)); color: var(--pb-text-muted); }

.turn-banner {
  position: absolute; left: 50%; top: 13%; display: flex; align-items: center; gap: calc(16px * var(--u));
  padding: calc(10px * var(--u)) calc(36px * var(--u)) calc(10px * var(--u)) calc(10px * var(--u));
  border-radius: 999px; background: var(--c, var(--pb-accent)); color: var(--pb-on-accent);
  font-size: calc(48px * var(--u)); font-weight: 900; white-space: nowrap;
  box-shadow: 0 calc(10px * var(--u)) calc(30px * var(--u)) rgba(5, 6, 20, 0.4), inset 0 calc(-5px * var(--u)) 0 rgba(0, 0, 0, 0.12);
  opacity: 0; transform: translate(-50%, calc(-24px * var(--u))) scale(0.96);
  transition: opacity var(--pb-motion) var(--pb-ease), transform var(--pb-motion) var(--pb-ease);
}
.turn-banner.on { opacity: 1; transform: translate(-50%, 0) scale(1); }
.turn-banner .avatar { width: calc(68px * var(--u)); height: calc(68px * var(--u)); border-radius: 50%; background: #fff; display: grid; place-items: center; }
.turn-banner .avatar svg { width: 78%; height: 78%; }

.prompt {
  position: absolute; left: 50%; bottom: calc(168px * var(--u)); display: flex; align-items: center; gap: calc(14px * var(--u));
  padding: calc(12px * var(--u)) calc(32px * var(--u)); border-radius: 999px; background: var(--panel);
  font-size: calc(36px * var(--u)); font-weight: 800; white-space: nowrap;
  box-shadow: 0 calc(8px * var(--u)) calc(24px * var(--u)) rgba(5, 6, 20, 0.35);
  opacity: 0; transform: translate(-50%, calc(12px * var(--u)));
  transition: opacity var(--pb-motion) var(--pb-ease), transform var(--pb-motion) var(--pb-ease);
}
.prompt.on { opacity: 1; transform: translate(-50%, 0); }
kbd {
  font-family: inherit; font-weight: 900; color: var(--pb-on-accent); background: var(--pb-text);
  border-radius: calc(12px * var(--u)); padding: calc(2px * var(--u)) calc(16px * var(--u));
  box-shadow: 0 calc(5px * var(--u)) 0 var(--pb-text-muted);
}

.caption {
  position: absolute; left: 50%; top: calc(26px * var(--u)); display: flex; align-items: baseline; gap: calc(16px * var(--u));
  padding: calc(10px * var(--u)) calc(28px * var(--u)); border-radius: 999px; background: var(--pb-accent-2); color: var(--pb-on-accent);
  font-size: calc(32px * var(--u)); font-weight: 900; white-space: nowrap;
  opacity: 0; transform: translate(-50%, calc(-12px * var(--u)));
  transition: opacity var(--pb-motion) var(--pb-ease), transform var(--pb-motion) var(--pb-ease);
}
.caption.on { opacity: 1; transform: translate(-50%, 0); }
.caption-sub { font-weight: 700; opacity: 0.78; }

.bubbles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.tag, .bubble, .pin { position: absolute; left: 0; top: 0; will-change: transform; white-space: nowrap; }
.tag {
  font-size: calc(28px * var(--u)); font-weight: 900; color: var(--pb-on-accent); background: var(--c);
  padding: calc(4px * var(--u)) calc(16px * var(--u)); border-radius: 999px; opacity: 0;
  box-shadow: 0 calc(4px * var(--u)) calc(12px * var(--u)) rgba(5, 6, 20, 0.35); transition: opacity var(--pb-motion) var(--pb-ease);
}
.tag.on { opacity: 1; }
.bubble {
  font-size: calc(40px * var(--u)); font-weight: 900; padding: calc(6px * var(--u)) calc(22px * var(--u)); border-radius: 999px;
  background: var(--pb-accent-2); color: var(--pb-on-accent); box-shadow: 0 calc(6px * var(--u)) calc(18px * var(--u)) rgba(5, 6, 20, 0.4);
}
.bubble.lose { background: var(--pb-danger); color: #fff; }
.bubble.event { background: #9b6bff; color: #fff; }
.bubble.star { font-size: calc(56px * var(--u)); background: linear-gradient(180deg, #ffe58a, #ffc93c); }

.players {
  position: absolute; left: 50%; bottom: calc(24px * var(--u)); transform: translateX(-50%);
  display: grid; grid-auto-flow: column; gap: calc(16px * var(--u));
}
.player {
  display: flex; align-items: center; gap: calc(16px * var(--u)); min-width: calc(268px * var(--u));
  padding: calc(10px * var(--u)) calc(24px * var(--u)) calc(10px * var(--u)) calc(10px * var(--u));
  background: var(--panel); border-radius: calc(24px * var(--u)); border: calc(3px * var(--u)) solid rgba(255, 255, 255, 0.06);
  box-shadow: 0 calc(8px * var(--u)) calc(22px * var(--u)) rgba(5, 6, 20, 0.35);
  transition: transform var(--pb-motion) var(--pb-ease), border-color var(--pb-motion) var(--pb-ease), box-shadow var(--pb-motion) var(--pb-ease);
}
.player.active {
  border-color: var(--c); transform: translateY(calc(-8px * var(--u)));
  box-shadow: 0 0 0 calc(5px * var(--u)) color-mix(in srgb, var(--c) 30%, transparent), 0 calc(12px * var(--u)) calc(26px * var(--u)) rgba(5, 6, 20, 0.45);
}
.avatar { flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--pb-surface-2); }
.player .avatar { width: calc(76px * var(--u)); height: calc(76px * var(--u)); box-shadow: inset 0 0 0 calc(3px * var(--u)) color-mix(in srgb, var(--c) 55%, transparent); }
.avatar-svg { width: 76%; height: 76%; }
.player .name { font-size: calc(32px * var(--u)); font-weight: 900; line-height: 1.1; }
.counts { display: flex; gap: calc(18px * var(--u)); font-weight: 900; font-variant-numeric: tabular-nums; }
.player .counts { font-size: calc(32px * var(--u)); line-height: 1.15; }
.count { display: inline-flex; align-items: center; gap: calc(6px * var(--u)); }
.icon { width: 1em; height: 1em; }
.coin { display: inline-block; width: 0.82em; height: 0.82em; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff1a8, #ffc93c 45%, #d99400); box-shadow: inset 0 0 0 0.08em #b97a00; }

.toolbar {
  position: absolute; right: calc(24px * var(--u)); bottom: calc(24px * var(--u)); display: flex; flex-direction: column; gap: 8px;
  pointer-events: auto;
}
.tool {
  min-height: var(--pb-touch); min-width: 196px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 6px 8px 6px 16px; border: 0; border-radius: var(--pb-radius-1); background: var(--panel); color: var(--pb-text);
  font: 800 18px var(--pb-font); cursor: pointer; transition: background var(--pb-motion-fast) var(--pb-ease);
}
.tool kbd { font-size: 14px; border-radius: 8px; padding: 2px 8px; box-shadow: 0 3px 0 var(--pb-text-muted); }
.tool:hover { background: var(--pb-surface-2); }
.tool:focus-visible, .roll:focus-visible { outline: 3px solid var(--pb-info); outline-offset: 3px; }
.tool[aria-pressed="true"] { background: var(--pb-accent-3); color: var(--pb-on-accent); }

/* narrow TV windows: smaller cards in two rows */
@media (max-aspect-ratio: 1/1) {
  .players { grid-auto-flow: row; grid-template-columns: repeat(2, minmax(0, 1fr)); width: calc(100% - 24px); }
  .player { min-width: 0; }
  .toolbar { display: none; }
}

/* ---------- phone ---------- */
body.phone { display: flex; flex-direction: column; height: 100dvh; }
.hud-phone {
  flex: 1; min-height: 0; display: flex; flex-direction: column; gap: var(--pb-space-3);
  padding: max(var(--pb-space-3), env(safe-area-inset-top)) var(--pb-space-4) max(var(--pb-space-4), env(safe-area-inset-bottom));
}
.hud-phone .pb-header { display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
.hud-phone .mark { width: 34px; height: 34px; }
.hud-phone .brand { gap: 8px; }
.hud-phone .brand-name, .hud-phone .brand-game { font-size: 20px; }
.hud-phone .status { font-size: 16px; color: var(--pb-text-muted); padding: 6px 12px; background: var(--pb-surface); border-radius: 999px; }
.map-card {
  position: relative; flex: 1 1 auto; min-height: 220px; border-radius: var(--pb-radius-2); overflow: hidden; background: #1a4a72;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.06), 0 10px 30px rgba(0, 0, 0, 0.35);
}
.map-card canvas.board { position: absolute; inset: 0; }
.map-label { position: absolute; left: 12px; top: 12px; z-index: 2; font-size: 14px; font-weight: 800; padding: 4px 12px; border-radius: 999px; background: var(--panel); color: var(--pb-text-muted); }
.pin {
  z-index: 3; font-size: 16px; font-weight: 900; color: var(--pb-on-accent); background: var(--c); padding: 4px 12px; border-radius: 999px;
  box-shadow: 0 4px 12px rgba(5, 6, 20, 0.45);
}
.pin::after { content: ''; position: absolute; left: 50%; bottom: -7px; margin-left: -7px; border: 7px solid transparent; border-bottom: 0; border-top-color: var(--c); }
.hud-phone .bubble { font-size: 18px; padding: 4px 12px; }
.hud-phone .bubble.star { font-size: 22px; }
.you-card { display: flex; align-items: center; gap: var(--pb-space-4); padding: var(--pb-space-3) var(--pb-space-4); background: var(--pb-surface); border-radius: var(--pb-radius-2); border: 2px solid color-mix(in srgb, var(--c) 45%, transparent); }
.you-card .avatar { width: 64px; height: 64px; }
.you-card .name { font-size: 22px; font-weight: 900; }
.you-card .counts { font-size: 22px; margin-top: 2px; }
.to-star { margin-top: 4px; font-size: 16px; color: var(--pb-text-muted); font-weight: 700; }
.turn-line { text-align: center; font-size: 18px; font-weight: 800; color: var(--pb-text); }
.turn-line::before { content: ''; display: inline-block; width: 12px; height: 12px; margin-right: 8px; border-radius: 50%; background: var(--c, var(--pb-accent)); vertical-align: 1px; }
.roll {
  min-height: 64px; border: 0; border-radius: var(--pb-radius-2); background: var(--pb-accent); color: var(--pb-on-accent);
  font: 900 24px var(--pb-font); cursor: pointer; box-shadow: inset 0 -5px 0 rgba(0, 0, 0, 0.15);
  transition: transform var(--pb-motion-fast) var(--pb-ease), background var(--pb-motion) var(--pb-ease);
}
.roll:active:not(:disabled) { transform: scale(0.98); }
.roll:disabled { background: var(--pb-surface-2); color: var(--pb-text-muted); cursor: default; box-shadow: none; }

@media (prefers-reduced-motion: reduce) {
  .turn-banner, .prompt, .caption { transform: translate(-50%, 0) !important; }
  .player.active { transform: none; }
  * { transition-duration: 1ms !important; }
}
body.calm .turn-banner, body.calm .prompt, body.calm .caption { transform: translate(-50%, 0) !important; }
body.calm .player.active { transform: none; }
body.calm * { transition-duration: 1ms !important; }
</style>
